name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -l cmd internal tests api
      - run: make generate-check
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/urbino
