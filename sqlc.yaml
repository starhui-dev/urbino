version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/0001_persistence.sql"
    queries: "sql/queries"
    gen:
      go:
        package: "generated"
        out: "internal/storage/postgres/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        query_parameter_limit: 5
